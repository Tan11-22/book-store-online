syntax="proto3";

package book;

option java_multiple_files = true;
option java_package = "com.BookStore.modules.bookGrpc";
option java_outer_classname = "BookProto";


service BookService {
  rpc GetCartDetails(BookRequest) returns (BookResponse) {}
}


message BookRequest {
  string isbn=1;
}



message BookResponse {
  string isbn = 1;
  string title = 2;
  int32 sale_price = 3;
  int32 discount_price = 4;
  int32 page_count = 5;
  int32 weight = 6;
  string image = 7;
}

